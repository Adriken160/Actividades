
openapi: 3.0.3
info:
  title: API de Métricas de Artistas
  version: 1.0.0
  description: API para obtener métricas de artistas como albums, seguidores y streams.

servers:
  - url: http://localhost:5000
    description: Servidor local de desarrollo

paths:
  /metrics/artist/{id}:
    get:
      tags:
        - metrics
      summary: Obtener métricas de un artista específico
      description: Retorna métricas relacionadas con el artista identificado por su ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del artista
          schema:
            type: string
      responses:
        '200':
          description: Métricas del artista obtenidas exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums:
                    type: integer
                    description: Número de álbumes lanzados por el artista
                  followers:
                    type: integer
                    description: Número de seguidores del artista
                  streams:
                    type: integer
                    description: Total de reproducciones del artista
        '404':
          description: Artista no encontrado