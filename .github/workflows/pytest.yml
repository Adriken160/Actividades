# Nombre del workflow
name: Pruebas de Python con Pytest

# Configura el workflow para que se dispare con cada push a la rama main
on:
  push:
    branches: [ "Repositorio-Clonado" ]

# Define los jobs del workflow
jobs:
  # 7. Define un job llamado tests
  tests:
    # 8. Configura este job para que se ejecute en un runner de Ubuntu
    # (Usaremos actions/setup-python para instalar la versión de Python)
    runs-on: ubuntu-latest

    # 9. El job debe tener los siguientes pasos
    steps:
      # 1. Descargar el código en el runner
      - name: Descargar el código
        uses: actions/checkout@v4

      # Paso extra (pero necesario) para configurar el entorno de Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          # Usamos una versión reciente y estable de Python
          python-version: '3.x'

      # 2. Instalar las dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3. Lanzar el comando pytest
      - name: Ejecutar pruebas con pytest
        run: pytest
