                password:
                  type: string
                  format: password
                  examples:
                  - Str0ngP@ssw0rd!
      responses:
        "200":
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    examples:
                    - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn:
                    type: integer
                    examples:
                    - 3600
        "401":
          description: No autorizado (token requerido o inválido)
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    examples:
                    - NOT_FOUND
                  message:
                    type: string
                    examples:
                    - El recurso solicitado no fue encontrado
                  details:
                    type: object
                    additionalProperties: true
                    examples:
                    - resource: user
                      id: "123"
                  timestamp:
                    type: string
                    format: date-time
                    examples:
                    - 2024-01-15T10:30:00Z
                  path:
                    type: string
                    examples:
                    - /api/v1/users/123
                  requestId:
                    type: string
                    format: uuid
                    examples:
                    - b4c8d2e0-5a6b-4c7d-8e9f-0a1b2c3d4e5f
