openapi: 3.1.0
info:
  title: "Audira API: ÉPICA 1 – Gestión de Usuarios y Comunidad"
  version: 1.0.0
  description: |
    Esta es la especificación para la Épica 1 de la plataforma Audira.
    Incluye todos los microservicios y operaciones relacionadas con la gestión de perfiles de usuario, métricas, interacción social y comunicación.

    **Microservicios incluidos:**
    - **Métricas y Estadísticas:** Endpoints para consultar estadísticas de usuarios, artistas y de la plataforma en general.
    - **Usuario (Perfil):** Operaciones para el registro, autenticación, y gestión de perfiles y seguidores.
    - **Valoraciones y Comentarios:** Gestión de valoraciones y comentarios sobre el contenido musical.
    - **Comunicación:** Endpoints para el contacto con soporte, FAQs y notificaciones de usuario.
  contact:
    name: Equipo de Desarrollo Audira
    email: dev-support@audira.io
servers:
- url: https://api.audira.io/v1
  description: Servidor de Producción
- url: https://staging-api.audira.io/v1
  description: Servidor de Staging
- url: http://localhost:3000/api/v1
  description: Servidor Local de Desarrollo
tags:
- name: User
  description: "Operaciones relacionadas con usuarios, perfiles, autenticación y comunidad."
- name: Metrics
  description: Endpoints para obtener métricas y estadísticas de la plataforma.
- name: Ratings & Comments
  description: "Gestión de valoraciones, y comentarios de los usuarios."
- name: Communication
  description: "Operaciones de contacto, notificaciones y FAQs."
paths:
  /users/register:
    post:
      tags:
      - User
      summary: Registrar un nuevo usuario
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - email
              - password
              properties:
                username:
                  type: string
                  examples:
                  - newuser
                email:
                  type: string
                  format: email
                  examples:
                  - user@example.com
                password:
                  type: string
                  format: password
                  examples:
                  - Str0ngP@ssw0rd!
      responses:
        "201":
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    examples:
                    - a1b2c3d4-e5f6-7890-1234-567890abcdef
                  username:
                    type: string
                    examples:
                    - audirauser
                  email:
                    type: string
                    format: email
                    examples:
                    - user@audira.io
                  followers:
                    type: integer
                    examples:
                    - 1500
                  following:
                    type: integer
                    examples:
                    - 250
                  bio:
                    type: string
                    examples:
                    - Bio of the user...
        "400":
          description: Solicitud inválida
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    examples:
                    - NOT_FOUND
                  message:
                    type: string
                    examples:
                    - El recurso solicitado no fue encontrado
                  details:
                    type: object
                    additionalProperties: true
                    examples:
                    - resource: user
                      id: "123"
                  timestamp:
                    type: string
                    format: date-time
                    examples:
                    - 2024-01-15T10:30:00Z
                  path:
                    type: string
                    examples:
                    - /api/v1/users/123
                  requestId:
                    type: string
                    format: uuid
                    examples:
                    - b4c8d2e0-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        "409":
          description: Conflicto (el recurso ya existe)
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    examples:
                    - NOT_FOUND
                  message:
                    type: string
                    examples:
                    - El recurso solicitado no fue encontrado
                  details:
                    type: object
                    additionalProperties: true
                    examples:
                    - resource: user
                      id: "123"
                  timestamp:
                    type: string
                    format: date-time
                    examples:
                    - 2024-01-15T10:30:00Z
                  path:
                    type: string
                    examples:
                    - /api/v1/users/123
                  requestId:
                    type: string
                    format: uuid
                    examples:
                    - b4c8d2e0-5a6b-4c7d-8e9f-0a1b2c3d4e5f
